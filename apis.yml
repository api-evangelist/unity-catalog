- aid: unity-catalog:unity-catalog-functions-api
  name: Unity Catalog Functions API
  description: >-
    Functions implement User-Defined Functions (UDFs) in Unity Catalog.

    The function implementation can be a SQL expression/query or a python function, and it can be invoked
    wherever a table reference is allowed in a query.

    In Unity Catalog, a function resides at the same level as a table, so it can be referenced with the
    form __catalog_name__.__schema_name__.__function_name__.
  humanURL: https://go.unitycatalog.io/apidocs
  baseURL: https://api.unitycatalog.io
  tags:
  - Functions
