- aid: unity-catalog:unity-catalog-model-versions-api
  name: Unity Catalog Model Versions API
  description: >-
    Model versions contain all artifact files associated with an individual machine learning model. They
    are associated with a single parent model and have an integer identifier, indicating the version number
    of the model.

    Model versions are referenced via model URI's using the Unity Catalog three-level namespace of the
    registered model and the version identifier.
  humanURL: https://go.unitycatalog.io/apidocs
  baseURL: https://api.unitycatalog.io
