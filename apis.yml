- aid: unity-catalog:unity-catalog-registered-models-api
  name: Unity Catalog Registered Models API
  description: >-
    Registered models are machine learning models that are stored within the Unity Catalog model registry.
    They are comprised of all versions of a single model that a user wishes to keep.

    A registered model resides in the third layer of Unity Catalog’s three-level namespace, and can be
    referenced with the form __catalog_name__.__schema_name__.__model_name__.
