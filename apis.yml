aid: unity-catalog

name: Unity Catalog

image: https://unitycatalog.netlify.app/images/default-image.jpg

description: Unity Catalog provides an industry‑first universal catalog for data and AI, enabling organizations to manage, discover, and govern
  data assets across multiple formats, engines, and environments. The platform offers multimodal interfaces, extensive integrations with tools
  like Spark, DuckDB, and LangChain, and supports AI workloads through dedicated APIs. It includes features for tables, functions, models, and
  user privileges, along with robust security and governance capabilities.

