  terms:
  - term: Catalogs
    definition: A catalog is the first layer of Unity Catalog’s three-level namespace. It’s used to organize your data assets.
    tags:
    - Resource Group
    source: openapi/unitycatalog-all.yaml
  - term: Schemas
    definition: A schema (also called a database) is the second layer of Unity Catalog’s three-level namespace. A schema organizes tables, volumes
      and functions.
    tags:
    - Resource Group
    source: openapi/unitycatalog-all.yaml
  - term: Tables
    definition: A table resides in the third layer of Unity Catalog’s three-level namespace. It contains rows of data. A table can be managed
      or external.
    tags:
    - Resource Group
    source: openapi/unitycatalog-all.yaml
  - term: Volumes
    definition: Volumes are a Unity Catalog capability for accessing, storing, governing, organizing and processing files. Use cases include running
      machine learning on unstructured data such as image, audio, video, or PDF files, organizing data sets during the data exploration stages
      in data science, working with libraries that require access to the local file system on cluster machines, storing library and conf
    tags:
    - Resource Group
    source: openapi/unitycatalog-all.yaml
  - term: Functions
    definition: Functions implement User-Defined Functions (UDFs) in Unity Catalog. The function implementation can be a SQL expression/query
      or a python function, and it can be invoked wherever a table reference is allowed in a query. In Unity Catalog, a function resides at the
      same level as a table, so it can be referenced with the form __catalog_name__.__schema_name__.__function_name__.
    tags:
    - Resource Group
    source: openapi/unitycatalog-all.yaml
  - term: RegisteredModels
    definition: Registered models are machine learning models that are stored within the Unity Catalog model registry. They are comprised of all
      versions of a single model that a user wishes to keep. A registered model resides in the third layer of Unity Catalog’s three-level namespace,
      and can be referenced with the form __catalog_name__.__schema_name__.__model_name__.
    tags:
    - Resource Group
    source: openapi/unitycatalog-all.yaml
  - term: ModelVersions
    definition: Model versions contain all artifact files associated with an individual machine learning model. They are associated with a single
      parent model and have an integer identifier, indicating the version number of the model. Model versions are referenced via model URI's using
      the Unity Catalog three-level namespace of the registered model and the version identifier.
    tags:
    - Resource Group
    source: openapi/unitycatalog-all.yaml
  - term: TemporaryCredentials
    definition: Temporary credentials are used to access storage locations or assets for a limited lifetime.
    tags:
    - Resource Group
    source: openapi/unitycatalog-all.yaml
  - term: Permissions
    definition: In Unity Catalog, data is secure by default. Access can be granted.
    tags:
    - Resource Group
    source: openapi/unitycatalog-all.yaml
  - term: Metastores
    definition: A metastore is the top-level container of objects in Unity Catalog that stores all UC assets.
    tags:
    - Resource Group
    source: openapi/unitycatalog-all.yaml
  - term: DeltaCommits
    definition: '"Delta commits" is a Delta tables feature that allows Delta tables to designate a coordinator to coordinate commits. This is
      Unity Catalog''s API to allow Unity Catalog be the commit coordinator for managed tables. (See https://github.com/delta-io/delta/blob/master/protocol_rfcs/catalog-managed.md
      for more details)'
    tags:
    - Resource Group
    source: openapi/unitycatalog-all.yaml
